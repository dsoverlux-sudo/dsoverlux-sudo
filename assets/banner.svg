<svg width="880" height="240" viewBox="0 0 880 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sovereign Lux Academy banner with cute lion mascot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#131c33"/>
    </linearGradient>
    <radialGradient id="mane" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#F0C674"/>
      <stop offset="0.6" stop-color="#E8B44A"/>
      <stop offset="1" stop-color="#C6893A"/>
    </radialGradient>
  </defs>

  <rect width="880" height="240" rx="20" fill="url(#bg)"/>

  <!-- soft dotted texture, subtle -->
  <g fill="#C6A55E" opacity="0.06">
    <circle cx="760" cy="40" r="3"/><circle cx="800" cy="70" r="3"/><circle cx="820" cy="30" r="2"/>
    <circle cx="60" cy="200" r="3"/><circle cx="100" cy="215" r="2"/><circle cx="40" cy="170" r="2"/>
  </g>

  <!-- ===== Cute lion mascot ===== -->
  <g transform="translate(120,120)">
    <!-- mane: rounded fluffy petals -->
    <g fill="url(#mane)">
      <circle cx="0" cy="-58" r="20"/><circle cx="41" cy="-41" r="20"/><circle cx="58" cy="0" r="20"/>
      <circle cx="41" cy="41" r="20"/><circle cx="0" cy="58" r="20"/><circle cx="-41" cy="41" r="20"/>
      <circle cx="-58" cy="0" r="20"/><circle cx="-41" cy="-41" r="20"/>
      <circle cx="21" cy="-54" r="18"/><circle cx="54" cy="-21" r="18"/><circle cx="54" cy="21" r="18"/>
      <circle cx="21" cy="54" r="18"/><circle cx="-21" cy="54" r="18"/><circle cx="-54" cy="21" r="18"/>
      <circle cx="-54" cy="-21" r="18"/><circle cx="-21" cy="-54" r="18"/>
    </g>
    <!-- face -->
    <circle cx="0" cy="0" r="46" fill="#FBE3B3"/>
    <!-- ears -->
    <circle cx="-30" cy="-34" r="11" fill="#F0C674"/>
    <circle cx="30" cy="-34" r="11" fill="#F0C674"/>
    <!-- eyes (happy) -->
    <circle cx="-16" cy="-4" r="6" fill="#2b2113"/>
    <circle cx="16" cy="-4" r="6" fill="#2b2113"/>
    <circle cx="-14" cy="-6" r="2" fill="#ffffff"/>
    <circle cx="18" cy="-6" r="2" fill="#ffffff"/>
    <!-- cheeks -->
    <circle cx="-26" cy="12" r="6" fill="#F6B7A0" opacity="0.7"/>
    <circle cx="26" cy="12" r="6" fill="#F6B7A0" opacity="0.7"/>
    <!-- muzzle -->
    <path d="M0 6 l-6 8 h12 z" fill="#C6893A"/>
    <path d="M0 14 q-9 12 -18 6" fill="none" stroke="#C6893A" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M0 14 q9 12 18 6" fill="none" stroke="#C6893A" stroke-width="2.4" stroke-linecap="round"/>
    <!-- tiny crown (sovereign) -->
    <path d="M-16 -44 l5 -12 l6 8 l5 -12 l6 12 l5 -8 l5 12 z" fill="#E8B44A" stroke="#0B1120" stroke-width="1.2" stroke-linejoin="round"/>
  </g>

  <!-- ===== Wordmark ===== -->
  <text x="230" y="98" font-family="Playfair Display, Georgia, serif" font-size="46" font-weight="700" fill="#F4F6FB">SOVER<tspan fill="#E8B44A">LUX</tspan></text>
  <text x="232" y="132" font-family="Verdana, sans-serif" font-size="15" fill="#9AA6BE" letter-spacing="1">ISO 국제표준 교육 × 실무 도구 · 1인 운영 플랫폼</text>
  <text x="232" y="164" font-family="Georgia, serif" font-size="14" fill="#5C6A87" font-style="italic">"강의를 사고 끝나지 않는다 — 수료 후에도 도구를 평생 쓴다."</text>

  <!-- badges row -->
  <g font-family="Verdana, sans-serif" font-size="11">
    <rect x="232" y="184" width="132" height="26" rx="13" fill="none" stroke="#E8B44A" opacity="0.8"/>
    <text x="298" y="201" text-anchor="middle" fill="#E8B44A">ISO 27001 · 진행중</text>
    <rect x="372" y="184" width="112" height="26" rx="13" fill="none" stroke="#4ADE80" opacity="0.7"/>
    <text x="428" y="201" text-anchor="middle" fill="#4ADE80">GDPR · 구현완료</text>
    <rect x="492" y="184" width="150" height="26" rx="13" fill="none" stroke="#5C6A87"/>
    <text x="567" y="201" text-anchor="middle" fill="#9AA6BE">React 19 · Node 20 · TS</text>
  </g>
</svg>
